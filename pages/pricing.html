<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="../assets/logo/favicon.ico">
  <link rel="icon" type="image/png" sizes="512x512" href="../assets/logo/favicon.png">
  <link rel="apple-touch-icon" href="../assets/logo/apple-touch-icon.png">
  <title>Pricing</title>
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/pricing.css">
  <script src="../js/utils/navbar.js" defer></script>
</head>
<body>

  <div id="navbar"></div>

  <h1 class="page-title">Pricing</h1>

  <div class="pricing-container">
    <div class="cards-viewport">
      <div class="cards-wrapper">

        <div class="card side">
          <div>
            <h3>Price 1</h3>
            <div class="card-content">
              Content / Description
            </div>
          </div>
          <button class="btn">Select Plan</button>
        </div>

        <div class="card side">
          <div>
            <h3>Price 2</h3>
            <div class="card-content">
              Content / Description
            </div>
          </div>
          <button class="btn">Select Plan</button>
        </div>

        <div class="card center">
          <div>
            <h3>Price 3</h3>
            <div class="card-content">
              Content / Description
            </div>
          </div>
          <button class="btn">Select Plan</button>
        </div>

        <div class="card side">
          <div>
            <h3>Price 4</h3>
            <div class="card-content">
              Content / Description
            </div>
          </div>
          <button class="btn">Select Plan</button>
        </div>

        <div class="card side">
          <div>
            <h3>Price 5</h3>
            <div class="card-content">
              Content / Description
            </div>
          </div>
          <button class="btn">Select Plan</button>
        </div>

      </div>
    </div>

    <div class="indicators">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <div class="controls">
      <button class="nav-btn">&larr;</button>
      <button class="nav-btn">&rarr;</button>
    </div>
  </div>

  <script src="../js/pages/pricing.js"></script>
</body>
</html>
