<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Téléphone 1 : aujourd'hui</title>
  <link rel="stylesheet" href="screens.css">
  <style>
    .contenu { padding: 14px 22px; display: flex; flex-direction: column; gap: 18px; }
    .titre { display: flex; justify-content: space-between; align-items: center; }
    .titre h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; }
    .titre p { font-size: 15px; color: var(--doux); }
    .alerte { background: var(--rouge); color: #fff; border-radius: 22px; padding: 20px;
              display: flex; flex-direction: column; gap: 6px; box-shadow: 0 10px 24px rgba(164, 28, 28, .3); }
    .alerte .etiquette { color: #e9bcbc; }
    .alerte strong { font-size: 24px; font-weight: 800; }
    .alerte small { font-size: 14px; color: #f8e3e3; }
    .alerte .barre { background: rgba(255, 255, 255, .25); margin-top: 8px; }
    .alerte .barre span { background: #fff; }
    h2 { font-size: 18px; font-weight: 800; }
    .cours { display: flex; gap: 14px; align-items: stretch; }
    .cours time { width: 48px; font-size: 14px; font-weight: 700; color: var(--doux); padding-top: 12px; }
    .bloc { flex: 1; border-radius: 16px; padding: 12px 14px; }
    .bloc b { display: block; font-size: 16px; }
    .bloc small { font-size: 13px; opacity: .85; }
  </style>
</head>
<body>
  <div class="ecran-tel">
    <div class="statut"><span>9:41</span>
      <span class="icones"><i style="width:16px;height:10px"></i><i style="width:14px;height:10px;border-radius:50% 50% 0 0"></i><i style="width:24px;height:12px;border-radius:4px"></i></span></div>

    <div class="contenu">
      <div class="titre">
        <div><h1>Aujourd'hui</h1><p>Mardi 10 novembre</p></div>
        <span class="avatar">L</span>
      </div>

      <div class="alerte">
        <span class="etiquette">Prochaine échéance</span>
        <strong>Devoir 3</strong>
        <small>ITI1121 · Jeudi 23 h 59 · 15 %</small>
        <div class="barre"><span style="width: 65%"></span></div>
      </div>

      <h2>Cours du jour</h2>
      <div class="cours"><time>8 h 30</time>
        <div class="bloc" style="background: var(--mat-c); color: var(--mat);"><b>MAT1341</b><small>Algèbre linéaire · STE B0138</small></div></div>
      <div class="cours"><time>11 h 30</time>
        <div class="bloc" style="background: var(--phi-c); color: var(--phi);"><b>PHI1101</b><small>Raisonnement · DMS 1120</small></div></div>
      <div class="cours"><time>14 h 30</time>
        <div class="bloc" style="background: var(--seg-c); color: var(--seg);"><b>SEG2105</b><small>Labo · CBY B02</small></div></div>
    </div>

    <nav class="onglets">
      <div class="actif"><svg class="ic" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Aujourd'hui</div>
      <div><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendrier</div>
      <div><svg class="ic" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>Importer</div>
      <div><svg class="ic" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5"/></svg>Cours</div>
    </nav>
  </div>
</body>
</html>
